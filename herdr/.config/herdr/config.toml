# herdr configuration — managed via dotfiles (stow package "herdr")
# Only this file (and plugins/) is tracked in git; logs, sockets, session.json,
# session-snapshots and .plugins.lock are runtime state and gitignored.
#
# Validate: herdr config check
# Apply to running server: herdr server reload-config
#
# Keymap: full tmux default port (prefix = backtick, matching personal tmux.conf),
# plus vim-style workspace/agent nav. Hierarchy map: workspace ≈ tmux session,
# tab ≈ tmux window, pane ≈ tmux pane.

onboarding = false

[theme]
# Follow the host terminal palette (like tmux `status-style bg=default`)
name = "terminal"

[terminal]
# default_shell unset → uses $SHELL (fish)

[keys]
# tmux muscle memory: `set -g prefix ``
# Pressing the prefix twice sends a literal backtick (built-in send-prefix),
# so tmux's `bind ` last-window` / `bind e send-prefix` need no binding.
prefix = "backtick"

help = "prefix+?"     # tmux ?   list-keys
detach = "prefix+d"   # tmux d   detach-client

# --- workspaces (tmux sessions) ---
rename_workspace = "prefix+$"        # tmux $ rename-session
workspace_picker = "prefix+s"        # tmux s choose-tree -s
previous_workspace = "prefix+shift+h" # vim-style; tmux ( is a command binding below
next_workspace = "prefix+shift+l"     # vim-style; tmux ) is a command binding below
switch_workspace = "prefix+ctrl+1..9"
new_workspace = "prefix+shift+n"     # no tmux default
close_workspace = "prefix+shift+d"   # no tmux default; guarded by ui.confirm_close

# --- tabs (tmux windows) ---
new_tab = "prefix+c"                 # tmux c new-window
rename_tab = "prefix+,"              # tmux , rename-window
close_tab = "prefix+&"               # tmux & kill-window
previous_tab = "prefix+p"            # tmux p previous-window
next_tab = "prefix+n"                # tmux n next-window
switch_tab = "prefix+1..9"           # tmux 1..9 select-window (herdr has no 0)
move_tab_previous = "alt+shift+left" # no tmux default
move_tab_next = "alt+shift+right"
goto = "prefix+f"                    # tmux f find-window

# --- panes ---
# personal tmux overrides tmux's default arrow bindings with hjkl
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+o"         # tmux o select-pane -t :.+
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+;"               # tmux ; last-pane
split_vertical = "prefix+\""         # tmux " split-window
split_horizontal = "prefix+%"        # tmux % split-window -h
close_pane = "prefix+x"              # personal tmux: kill-pane without confirm
zoom = "prefix+z"                    # tmux z resize-pane -Z
resize_mode = "prefix+r"             # herdr resize mode (tmux r = refresh-client: no equivalent)
resize_pane_left = "ctrl+shift+alt+h"  # direct (no prefix), vim-style
resize_pane_down = "ctrl+shift+alt+j"
resize_pane_up = "ctrl+shift+alt+k"
resize_pane_right = "ctrl+shift+alt+l"
rename_pane = "prefix+shift+p"       # no tmux default
# edit_scrollback = "prefix+e"         # herdr default

# --- herdr-only extras (no tmux analog) ---
settings = "prefix+shift+s"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+shift+o"
new_worktree = "prefix+shift+g"
toggle_sidebar = "prefix+b"
previous_agent = "prefix+shift+j"
next_agent = "prefix+shift+k"
focus_agent = "prefix+alt+1..9"

# vim-style movement inside navigate mode (arrows also keep working)
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# --- command bindings for tmux defaults herdr has no native action for ---

# tmux { swap-pane -U
[[keys.command]]
key = "prefix+{"
type = "shell"
command = "herdr pane swap --current --direction up"

# tmux } swap-pane -D
[[keys.command]]
key = "prefix+}"
type = "shell"
command = "herdr pane swap --current --direction down"

# tmux ! break-pane (pane → own tab)
[[keys.command]]
key = "prefix+!"
type = "shell"
command = "herdr pane move \"$(herdr pane current | jq -r '.result.pane.pane_id')\" --new-tab"

# tmux ( switch-client -p (previous workspace)
[[keys.command]]
key = "prefix+("
type = "shell"
command = "herdr workspace focus \"$(herdr workspace list | jq -r '.result.workspaces as $w | ($w|map(.focused)|index(true)) as $i | $w[($i - 1 + ($w|length)) % ($w|length)].workspace_id')\""

# tmux ) switch-client -n (next workspace)
[[keys.command]]
key = "prefix+)"
type = "shell"
command = "herdr workspace focus \"$(herdr workspace list | jq -r '.result.workspaces as $w | ($w|map(.focused)|index(true)) as $i | $w[($i + 1) % ($w|length)].workspace_id')\""

# --- tmux defaults with NO herdr equivalent (deliberately unbound) ---
# Space / M-1..5  select-layout, next-layout   (no layout engine)
# C-o / M-o       rotate-window
# m / M           mark pane
# # = -           paste buffers
# ]               paste-buffer (use terminal paste: ctrl+shift+v / shift+insert)
# :               command-prompt
# '               select-window by index prompt (goto on prefix+f covers this)
# .               move-window to index (only directional move_tab_* exist)
# q               display-panes
# t               clock-mode
# i               display-message info
# ~               show-messages
# D               choose-client
# C-z             suspend-client
# L / l           last-session / last-window (no last-tab action; l is pane-right
#                 in personal tmux, ` is reserved for a literal backtick)
# [ / PPage       copy-mode (no herdr equivalent; herdr scrolls pane scrollback
#                 with the mouse wheel natively)

[ui]
# tmux theme port: default bg + blue accents
accent = "blue"
# tmux: status-position bottom
tab_bar_position = "bottom"
# tmux-style internal splitters, no outside frame, no gaps
pane_outer_borders = false
pane_gaps = false
# tmux: prefix+c creates a window immediately
prompt_new_tab_name = false
# tmux & confirms before kill-window; herdr confirms before closing a workspace
confirm_close = true
